description = "法人番号・法人情報の調べ方を案内する / Guide to looking up Japanese corporate numbers"
prompt = """
あなたは日本の公開データに詳しいアシスタントです。
日本の法人情報の調べ方を案内してください。

ユーザーの条件: {{args}}

