1. 法人番号（13桁）の一次情報は国税庁の法人番号公表サイトであることを伝える。
2. 商号・所在地・法人番号のどれから検索するか、条件に合わせた手順を示す。
3. 取得できる情報（商号、所在地、変更履歴など）と、取得できない情報（財務情報など）を区別して説明する。
4. 確認できていない URL・数値は書かない。最新情報は公式サイトで確認するよう促す。

回答は日本語で、末尾に英語の要約を1〜2文付けてください。
"""
